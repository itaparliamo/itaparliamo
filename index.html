/* ===== Venetian travel theme ===== */
body{background:radial-gradient(circle at 0 0,var(--g1),transparent 42%),radial-gradient(circle at 100% 0,var(--g2),transparent 38%),repeating-linear-gradient(45deg,rgba(14,122,84,.04) 0 14px,transparent 14px 28px),var(--bg);background-attachment:fixed}

.nx[style*=var\(--card\)]{background:var(--card);box-shadow:none}
.sp{background:var(--card);color:var(--ac);border:1.5px solid var(--ac);box-shadow:none}
.w{border:1px solid var(--bd);border-left:4px solid var(--gold);border-radius:16px;background:var(--card);box-shadow:0 2px 8px rgba(0,0,0,.05)}

.q{border-radius:20px;position:relative}
.q::before{content:'';position:absolute;left:0;right:0;top:0;height:5px;border-radius:20px 20px 0 0;background:linear-gradient(90deg,#0e7a54 33%,#fff 33% 66%,#c4452f 66%)}
#o{counter-reset:o}
.o{counter-increment:o;position:relative;text-align:left;padding:13px 14px 13px 52px;border-radius:14px;background:var(--card);border:1.5px solid var(--bd);font-weight:500}
.o::before{content:counter(o,upper-alpha);position:absolute;left:12px;top:50%;transform:translateY(-50%);width:28px;height:28px;border-radius:50%;background:var(--bg);border:1.5px solid var(--bd);display:grid;place-items:center;font-size:13px;font-weight:700;color:var(--mu)}

.bb{background:var(--card);border:1px solid var(--bd);position:relative}
.ms .em{background:var(--card);border:2px solid var(--gold);border-radius:50%;width:56px;height:56px;display:grid;place-items:center;font-size:32px}

.nd::before{content:'';position:absolute;left:-27px;top:50%;width:13px;height:13px;border-radius:50%;transform:translateY(-50%);background:var(--gold);box-shadow:0 0 0 3px var(--bg)}

.nd:disabled::before{background:var(--bd)}

.stage{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--bd);border-radius:20px;padding:12px;border-top:4px solid var(--gold);margin:8px 0}

.wd{display:inline-block;padding:2px 9px;border-radius:99px;margin:2px;font-weight:600}.wo{background:rgba(14,122,84,.15);color:var(--ac)}.wx{background:rgba(196,69,47,.15);color:var(--bad);text-decoration:underline wavy}
